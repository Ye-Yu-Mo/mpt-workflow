name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
        if: matrix.os != 'ubuntu-latest' || matrix.node != 22
      - name: coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm run test:coverage
      - name: upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error

  smoke:
    name: smoke (cli + dashboard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: init a throwaway workspace and read status
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          mkdir -p "$TMP/demo/docs" "$TMP/demo/src"
          cd "$TMP/demo"
          git init -q
          git config user.email ci@example.com
          git config user.name ci
          printf '# PLAN: demo\n\n| M | 名称 |\n|---|---|\n| M1 | first |\n' > PLAN.md
          printf '# TODO-M1: first\n\n> 状态：待实现\n\n- **影响文件**：\n  - `src/lib.rs`\n' > TODO-M1.md
          echo 'fn f() {}' > src/lib.rs
          git add -A && git commit -qm init
          cd "$TMP"
          node "$GITHUB_WORKSPACE/dist/cli.js" init --root "$TMP" --repo demo
          node "$GITHUB_WORKSPACE/dist/cli.js" status --root "$TMP" | tee status.txt
          grep -q "M1" status.txt
          grep -q "todo_ready" status.txt

  pack:
    name: npm package smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: pack, install and run from the tarball
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pkg" "$RUNNER_TEMP/install"
          npm pack --pack-destination "$RUNNER_TEMP/pkg"
          cd "$RUNNER_TEMP/install"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP"/pkg/mpt-workflow-*.tgz
          ./node_modules/.bin/mpt-workflow --help | tee help.txt
          grep -q "mpt-workflow" help.txt
          ./node_modules/.bin/mpt --help >/dev/null
          test -f node_modules/mpt-workflow/dist/web/public/index.html
